repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: main
    hooks:
      - id: ruff
        # Temporarily restrict ruff to the actively cleaned areas so pre-commit
        # doesn't fail on legacy files while we incrementally remediate them.
        # Pattern matches Python files under scripts/, tests/, and engine/.
        files: '^(scripts|tests|engine)/.*\.py$'
        args: ["--fix"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort
        args: ["--profile", "black"]
