[tool.ruff]
line-length = 88
target-version = "py312"
# Keep configuration minimal to avoid unknown rule selectors on older/newer ruff installs
# Exclude heavy/legacy directories initially to allow incremental linting
extend-exclude = ["replay/*", "research/*", "packaging/*"]

[tool.ruff.lint]
# Move deprecated top-level linter options here per ruff's warning
extend-ignore = ["E203"]

[tool.isort]
profile = "black"
line_length = 88
